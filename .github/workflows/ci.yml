name: Integrated application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python -m unittest discover -s src/parser/tests -p "test_*.py" -v
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        working-directory: company-news-analytics
      - run: python tools/validate_inputs.py
        working-directory: company-news-analytics
      - run: node tests/test_live_client.cjs
      - run: node tests/test_company_onboarding_client.cjs
      - run: node tests/test_report_presentation.cjs
      - run: node tests/test_currency_widget.cjs
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t alfa-hack:ci .
      - run: docker run --rm -v "${{ github.workspace }}/private-data:/app/private-data:ro" alfa-hack:ci init
      - name: Check UI without external API or model
        shell: bash
        run: |
          docker run -d --name alfa-hack-ci -e PIPELINE_AUTO_POLL=0 -p 127.0.0.1:8765:8765 -v "${{ github.workspace }}/private-data:/app/private-data:ro" alfa-hack:ci
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/api/state; then exit 0; fi
            sleep 2
          done
          docker logs alfa-hack-ci
          exit 1
      - name: Container logs
        if: failure()
        run: docker logs alfa-hack-ci || true
      - name: Stop smoke container
        if: always()
        run: docker rm -f alfa-hack-ci || true
