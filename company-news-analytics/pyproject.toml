[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "company-news-analytics"
version = "1.1.0"
description = "Local company/news/analytics retrieval with two-index intersection"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "sentence-transformers==5.7.0", "transformers==4.57.6", "torch==2.14.1", "tokenizers==0.22.2"]

[project.scripts]
news-analytics = "news_analytics.cli:main"
news-analytics-ui = "news_analytics.web:main"

[tool.setuptools]
packages = ["news_analytics"]

[tool.setuptools.package-data]
news_analytics = ["schema.sql", "web_static/*"]
